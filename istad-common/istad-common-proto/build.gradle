plugins {
    id 'java-library'
}

group = 'kh.eco.istad'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.protobuf:protobuf-java:4.36.2'

    api 'io.grpc:grpc-protobuf:1.85.0'
    api 'io.grpc:grpc-stub:1.85.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

def generatedProtoDir =
        layout.buildDirectory.dir('generated/sources/buf/main/java')

tasks.register('bufGenerate', Exec) {
    workingDir projectDir
    commandLine 'npx', 'buf', 'generate'

    inputs.dir('src/main/proto')
    inputs.file('buf.yaml')
    inputs.file('buf.gen.yaml')
    outputs.dir(generatedProtoDir)
}

sourceSets {
    main {
        java {
            srcDir generatedProtoDir
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('bufGenerate')
}
